[project]
name = "evidencex-backend"
version = "0.1.0"
description = "EvidenceX — Multimodal Evidence Intelligence and Investigation Platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    # Stage 3 evidence processing (versions verified installed on Python 3.13).
    "pymupdf>=2.1",
    "pillow>=13.0",
    "pytesseract>=0.3.13",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    # Knowledge-graph export (GraphML) and the graph-PDF layout (graph_export.py). It was
    # only installed transitively (via pymupdf). >= 3.4 still resolves on Python 3.11.
    "networkx>=3.4",
    # S3-compatible evidence storage (STORAGE_BACKEND=s3). Imported lazily; unused by
    # the default local storage. >= 1.36 for the checksum options in s3_store.py.
    "boto3>=1.36",
]

[project.optional-dependencies]
# Audio transcription. Heavy (ctranslate2, onnxruntime, av). Install with
# pip install -e ".[dev,audio]". The model itself is downloaded separately.
audio = [
    "faster-whisper>=1.2.1",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.vercel]
# Vercel Python runtime: the ASGI application it serves (backend/ is the project root).
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom intentionally calls Depends()/Query() in
# argument defaults; B008 is a false positive for routers.
"app/modules/*/router.py" = ["B008"]
"app/modules/*/router_*.py" = ["B008"]
"app/modules/auth/deps.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
